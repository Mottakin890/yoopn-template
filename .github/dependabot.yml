version: 2

updates:
  # Dart/Flutter dependencies are pinned in pubspec.lock and refreshed
  # deliberately (see the "Dependency versions are pinned" CI step).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"

  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, android]
    commit-message:
      prefix: "build(android)"