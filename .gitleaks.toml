# ---------------------------------------------------------------------------
# gitleaks configuration — https://github.com/gitleaks/gitleaks
#
# Used by:
#   .githooks/pre-commit        (local, blocks the commit)
#   .github/workflows/ci.yml    (CI, blocks the push)
#   tool/scan_secrets.sh        (manual / fallback sweep without gitleaks)
#
# Design: fail closed. A finding is a hard error; if a rule produces a false
# positive the fix is a narrow allowlist entry below — never a blanket skip
# of the scanner.
#
# Validated against the gitleaks v8 config schema (title / extend / allowlist
# with description, paths, regexes / rules with id, description, regex,
# keywords).
# ---------------------------------------------------------------------------

title = "yoopn-templates gitleaks config"

[extend]
# Keep gitleaks' own ruleset (generic-api-key, jwt, private-key, …) and add
# the provider-specific rules below.
useDefault = true

# ---------------------------------------------------------------------------
# Allowlist — narrow on purpose.
#
# Content-based: these are the documented placeholder shapes that legitimately
# appear in .env.example and the docs. Matching on content (not on path) means
# a real key can never hide in a file that is merely "documentation".
#
# NOT listed: private-key headers, sb_secret_…, AIza…, AKIA…. A private key or
# a Supabase service-role key is a finding in every file, including .env.example.
# ---------------------------------------------------------------------------
[allowlist]
regexes = [
  # Documented placeholders from .env.example
  '''YOUR_[A-Z0-9_]+''',
  '''your_supabase_[a-z0-9_]+''',
  '''https://YOUR-PROJECT-REF\.supabase\.co''',
  '''<project-ref>''',
  '''ca-app-pub-XXXXXXXXXXXXXXXX''',
  '''YYYYYYYYYY''',
  # Google's PUBLIC AdMob demo account (ca-app-pub-3940256099942544/…).
  # Published in Google's own docs; serves test ads and earns nothing.
  '''ca-app-pub-3940256099942544/[0-9]+''',
  '''ca-app-pub-3940256099942544~[0-9]+''',
]

# ---------------------------------------------------------------------------
# Provider-specific rules
# ---------------------------------------------------------------------------

[[rules]]
id = "supabase-key"
description = "Supabase publishable / secret key committed to the repository"
regex = '''\b(sb_publishable_|sb_secret_)[A-Za-z0-9_-]{20,}\b'''
keywords = ["sb_publishable_", "sb_secret_"]

[[rules]]
id = "supabase-project-url"
description = "Concrete Supabase project URL — the project ref is infrastructure-identifying"
regex = '''https://[a-z0-9]{20}\.supabase\.(co|in)'''
keywords = [".supabase.co"]

[[rules]]
id = "admob-production-unit"
description = "AdMob production app/unit id (Google's 3940256099942544 demo account is allowlisted above)"
regex = '''\bca-app-pub-(?!3940256099942544)[0-9]{10,}~[0-9]{6,}'''
keywords = ["ca-app-pub-"]

[[rules]]
id = "firebase-client-secret"
description = "Firebase / Google API client secrets"
regex = '''\b(AIza[0-9A-Za-z_-]{35}|GOCSPX-[0-9A-Za-z_-]{20,})\b'''
keywords = ["AIza", "GOCSPX-"]

[[rules]]
id = "android-keystore-credentials"
description = "Hard-coded keystore password in gradle config (a quoted literal, not a getProperty/env lookup)"
# Deliberately requires quotes: `storePassword = props.getProperty("storePassword")`
# and `= System.getenv("K")` are the SAFE patterns used by this project and
# must not be flagged. A real leak looks like storePassword="hunter2".
regex = '''(?i)\b(storePassword|keyPassword)\s*=\s*['"][^'"\n]{4,}['"]'''
path = '''(^|/)android/'''
keywords = ["storePassword", "keyPassword"]

[[rules]]
id = "flutter-dart-define-secret"
description = "A secret-looking value passed inline via --dart-define (CI/commits must use --dart-define-from-file)"
regex = '''--dart-define=[A-Z0-9_]*(KEY|SECRET|TOKEN|PASSWORD)[A-Z0-9_]*=[A-Za-z0-9_-]{16,}'''
keywords = ["--dart-define="]